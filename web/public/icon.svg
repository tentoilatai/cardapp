<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3D1231" />
      <stop offset="60%" stop-color="#1F0A1B" />
      <stop offset="100%" stop-color="#120510" />
    </radialGradient>

    <!-- Pink Cloud Main Gradient -->
    <linearGradient id="pinkCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8EC7" />
      <stop offset="35%" stop-color="#FF3E9A" />
      <stop offset="75%" stop-color="#E6006F" />
      <stop offset="100%" stop-color="#AB0054" />
    </linearGradient>

    <!-- Cloud Highlight Gradient -->
    <linearGradient id="cloudHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFB3D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF3E9A" stop-opacity="0" />
    </linearGradient>

    <!-- Card Accent Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(255, 105, 180, 0.35)" stroke-width="3" />

  <!-- Ambient Glow Behind Cloud -->
  <circle cx="256" cy="256" r="140" fill="#FF1A8C" opacity="0.32" filter="url(#softGlow)" />

  <!-- Pink Cloud Silhouette with Glow -->
  <g filter="url(#pinkGlow)">
    <!-- Main Cloud Shape -->
    <path d="M 180 340 
             L 340 340 
             A 60 60 0 0 0 380 235 
             A 75 75 0 0 0 290 160 
             A 90 90 0 0 0 170 205 
             A 65 65 0 0 0 130 300 
             A 55 55 0 0 0 180 340 Z" 
          fill="url(#pinkCloudGrad)" />

    <!-- Cloud Top Gloss/Highlight -->
    <path d="M 180 336 
             L 340 336 
             A 57 57 0 0 0 376 238 
             A 72 72 0 0 0 292 165 
             A 86 86 0 0 0 174 209 
             A 62 62 0 0 0 134 300 
             A 52 52 0 0 0 180 336 Z" 
          fill="none" 
          stroke="url(#cloudHighlight)" 
          stroke-width="5" />

    <!-- Inner Fluffy Curves for Depth -->
    <ellipse cx="260" cy="225" rx="55" ry="45" fill="url(#cloudHighlight)" opacity="0.4" />
    <ellipse cx="325" cy="265" rx="35" ry="30" fill="url(#cloudHighlight)" opacity="0.3" />
    <ellipse cx="185" cy="275" rx="30" ry="25" fill="url(#cloudHighlight)" opacity="0.3" />
  </g>

  <!-- Stylized Liquid Glass Mini Credit Card over the Cloud -->
  <g transform="translate(195, 235) rotate(-10)">
    <!-- Card Shadow -->
    <rect x="0" y="0" width="150" height="95" rx="14" fill="rgba(0,0,0,0.35)" filter="url(#pinkGlow)" />
    <!-- Card Surface -->
    <rect x="0" y="0" width="150" height="95" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.75)" stroke-width="2" />
    <!-- Chip -->
    <rect x="18" y="24" width="28" height="22" rx="4" fill="#FFD700" opacity="0.9" />
    <!-- Chip Lines -->
    <line x1="18" y1="35" x2="46" y2="35" stroke="#B8860B" stroke-width="1.5" />
    <line x1="32" y1="24" x2="32" y2="46" stroke="#B8860B" stroke-width="1.5" />
    <!-- Card Wave Lines -->
    <path d="M 75 35 Q 100 20 130 35" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
    <path d="M 75 45 Q 100 30 130 45" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <!-- Card Dots -->
    <circle cx="24" cy="74" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="34" cy="74" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="44" cy="74" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="54" cy="74" r="3" fill="#FFFFFF" opacity="0.8" />
    <!-- Logo circles -->
    <circle cx="118" cy="72" r="10" fill="#FF3E9A" opacity="0.9" />
    <circle cx="128" cy="72" r="10" fill="#FFB3D9" opacity="0.8" />
  </g>

  <!-- Sparkle Stars -->
  <path d="M 390 145 Q 390 165 410 165 Q 390 165 390 185 Q 390 165 370 165 Q 390 165 390 145 Z" fill="#FFFFFF" />
  <path d="M 125 185 Q 125 198 138 198 Q 125 198 125 211 Q 125 198 112 198 Q 125 198 125 185 Z" fill="#FFB3D9" opacity="0.9" />
  <path d="M 380 345 Q 380 355 390 355 Q 380 355 380 365 Q 380 355 370 355 Q 380 355 380 345 Z" fill="#FFFFFF" opacity="0.8" />
</svg>
